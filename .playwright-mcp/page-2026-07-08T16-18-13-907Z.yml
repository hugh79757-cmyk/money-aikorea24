        - paragraph [ref=f114e102]: 치솟는 금리에 전세자금 대출 이자 부담으로 밤잠 설치는 직장인 신혼부부들을 위해 이 글을 준비했습니다. 의왕시에서 시행하는 신혼부부 주택임차보증금 대출지원 사업의 자격 조건, 지원 금액, 그리고 신청 방법까지 한눈에 보기 쉽게 정리해 드립니다.
