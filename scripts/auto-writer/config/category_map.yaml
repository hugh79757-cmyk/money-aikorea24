# ── 카테고리 목표 비중 (균형 발행용) ────────────────────────
category_quota:
  loan:      0.40
  insurance: 0.25
  invest:    0.20
  general:   0.15

# ── Gov24 서비스분야 → 블로그 카테고리 ─────────────────────
gov24_category_map:
  "고용·창업": "general"
  "주거·자립": "loan"
  "보건·의료": "insurance"
  "생활안정":  "general"
  "보육·교육": "general"
  "임신·출산": "insurance"
  "문화·환경": "general"
  "보호·돌봄": "insurance"
  "행정·안전": "general"
  "농림축산어업": null

# ── 금감원 finlife → 블로그 카테고리 ───────────────────────
finlife_category_map:
  "정기예금": "loan"
  "적금": "loan"
  "주택담보대출": "loan"
  "전세자금대출": "loan"

# ── data.go.kr → 블로그 카테고리 ───────────────────────────
datagokr_category_map:
  "ETF시세": "invest"
  "지수시세": "invest"

# ── 지원자격 텍스트 기반 페르소나 키워드 ───────────────────
persona_keywords:
  youth:
    include: ["청년", "만 19세", "만 34세", "20대", "30대 초반"]
    exclude: ["농업", "어업", "축산", "천일염"]
  worker:
    include: ["근로자", "재직자", "직장인", "피고용인", "고용보험 가입"]
    exclude: ["농업인", "어업인", "축산업", "천일염", "포장재"]
  newlywed:
    include: ["신혼부부", "혼인신고", "결혼 7년", "생애최초"]
    exclude: ["범죄피해", "폭력피해", "재난"]
  midlife:
    include: ["중장년", "만 40세", "만 50세", "경력단절", "재취업"]
    exclude: ["농업", "어업"]
  lowincome:
    include: ["저소득", "기초생활", "차상위", "중위소득 50%", "중위소득 60%"]
    exclude: []
  unhoused:
    include: ["쪽방", "고시원", "노숙인", "노숙자", "무료급식", "무료진료", "거리", "임시주거", "주거취약"]
    exclude: []

# ── 페르소나 → 딥링크 CTA URL ──────────────────────────────
persona_cta:
  youth:     "https://persona.aikorea24.kr/my-persona?src=cta-youth"
  worker:    "https://persona.aikorea24.kr/my-persona?src=cta-worker"
  newlywed:  "https://persona.aikorea24.kr/my-persona?src=cta-newlywed"
  unhoused:  "https://persona.aikorea24.kr/my-persona?src=cta-unhoused"
  lowincome: "https://persona.aikorea24.kr/my-persona?src=cta-lowincome"
  midlife:   "https://persona.aikorea24.kr/my-persona?src=cta-midlife"
  general:   "https://persona.aikorea24.kr/my-persona?src=cta-general"
  default:   "https://persona.aikorea24.kr/my-persona?src=cta-default"

# ── 카테고리별 FOMO 훅 템플릿 (도입부 첫문단) ──────────────
fomo_hooks:
  insurance: >
    치아·건강·간병… 40대 이상이라면 누구나 한 번쯤 고민하는 문제입니다.
    실제로 작년 한 해만 해도 수만 명이 이 보험 관련 혜택을 받았습니다.
  loan: >
    전세자금·주택담보대출… 내 집 마련에 진심이라면 모르면 손해인 혜택들이 있습니다.
    이미 수천 명이 이 기회를 놓치지 않았습니다.
  invest: >
    ETF·지수·연금… 투자에도 '지원금'이 있다는 사실, 알고 계셨나요?
    똑똑한 투자자라면 이 혜택부터 챙깁니다.
  general: >
    정부 지원금은 생각보다 많습니다. 다만 내 상황에 맞는 걸 찾기가 어려울 뿐이죠.
    지금 내가 받을 수 있는 혜택을 한눈에 확인해보세요.

# ── 카테고리/소스별 독자 페르소나 라벨 (뱅크샐러드 스타일 제목용) ──
persona_labels:
  loan: "무주택 직장인"
  insurance: "맞벌이 신혼부부"
  general:
    default: "30대 직장인"
    youth: "사회초년생 청년"
    elderly: "은퇴 준비 50대"
    small_biz: "소상공인"
    disability: "장애인 가구"
  finlife:
    정기예금: "목돈 굴리는 직장인"
    적금: "적금으로 목돈 모으는 20대"
    주택담보대출: "생애 최초 내집 마련 신혼부부"
    전세자금대출: "전세 계약 앞둔 무주택자"
  invest: "ETF·지수 투자 입문자"

# ── CTA 변인 맵 (Wave 4, T11) ─────────────────────────────
# 키: {cat}-{persona}. 미드(in-body) CTA = 약함/호기심 복사,
# 엔드(END) CTA = 강함/행동 복사. 각 항목은 A/B 2개 변인(리스트).
# 미발견 키는 default로 폴백. persona_cta/persona_labels는 그대로 유지.
cta_variants:
  default:
    mid:
      - "내 또래 평균이 궁금하다면? 한 번 확인해보세요"
      - "비슷한 조건의 사람들은 어떻게 살까요?"
    end:
      - "지금 내 페르소나 분석하기 →"
      - "내 상황 맞춤 통계 보러가기 →"
  loan-youth:
    mid:
      - "또래 청년들은 대출·금리 혜택을 어떻게 활용할까?"
      - "내 나이 또래의 평균 부채와 소득이 궁금하다면?"
    end:
      - "청년 맞춤 페르소나 분석하기 →"
      - "내 대출 한도 확인하러 가기 →"
  loan-worker:
    mid:
      - "무주택 직장인 또래는 주택·전세 자금을 어떻게 마련할까?"
      - "내 소득구간 주거 혜택이 궁금하다면?"
    end:
      - "직장인 주거 페르소나 분석하기 →"
      - "내 맞춤 주거 지원 확인하러 가기 →"
  loan-newlywed:
    mid:
      - "신혼부부 또래는 주택·자금을 어떻게 준비할까?"
      - "내 또래 신혼부부의 평균 자산이 궁금하다면?"
    end:
      - "신혼부부 페르소나 분석하기 →"
      - "내 맞춤 신혼 지원 확인하러 가기 →"
  insurance-youth:
    mid:
      - "또래 청년들이 가장 많이 드는 보험은?"
      - "내 나이 또래의 건강·보험 패턴이 궁금하다면?"
    end:
      - "청년 보험 페르소나 분석하기 →"
      - "내 보험료 비교하러 가기 →"
  insurance-newlywed:
    mid:
      - "신혼부부라면 챙겨야 할 건강·출산 혜택이 있어요"
      - "내 또래 부부의 보험 패턴이 궁금하다면?"
    end:
      - "신혼부부 보험 페르소나 보기 →"
      - "내 맞춤 보험 비교하러 가기 →"
  invest-worker:
    mid:
      - "같은 연봉 직장인들은 ETF·연금을 어떻게 굴릴까?"
      - "내 소득구간 투자 패턴이 궁금하다면?"
    end:
      - "직장인 투자 페르소나 보기 →"
      - "내 투자 성향 분석하러 가기 →"
  general-youth:
    mid:
      - "내 또래 청년들은 어떤 혜택을 받고 있을까?"
      - "비슷한 나이·지역 사람들의 생활 패턴이 궁금하다면?"
    end:
      - "지금 내 페르소나 분석하기 →"
      - "내 맞춤 통계 확인하러 가기 →"
  general-general:
    mid:
      - "내 또래는 어떤 혜택을 받고 있을까?"
      - "비슷한 지역·나이 사람들의 생활 패턴이 궁금하다면?"
    end:
      - "지금 내 페르소나 분석하기 →"
      - "내 맞춤 통계 확인하러 가기 →"
