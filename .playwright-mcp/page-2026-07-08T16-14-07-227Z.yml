        - separator [ref=f30e76]
        - paragraph [ref=f30e77]: 2040 직장인, 의왕시 이사비 40만 원 지원받는 막차 타는 법 총정리
        - paragraph [ref=f30e78]: 새로운 동네로 이사하며 복사비와 중개수수료가 부담스러운 2040 직장인분들을 위해 이 글을 씁니다. 의왕시에서 제공하는 청년 이사비 지원 사업의 자격 조건부터 최대 40만 원 혜택을 놓치지 않는 신청 방법까지 한 번에 정리해 드립니다.
        - paragraph [ref=f30e79]: ⚠️ 본 정보는 2026년 5월 기준 의왕시 공고안을 바탕으로 작성되었습니다.
        - heading "의왕시 청년 이사비 지원이란 무엇인가요?" [level=2] [ref=f30e80]
        - paragraph [ref=f30e81]:
          - text: 이 사업은 의왕시로 새롭게 전입하는 청년들의 초기 정착 부담을 덜어주기 위해 시행됩니다. 단순히 현금을 주는 것이 아니라, 실제 지출한 이사 비용과 부동산 중개보수를
          - strong [ref=f30e82]: 최대 40만 원
          - text: 까지 환급해 주는 실질적인 혜택입니다.
        - paragraph [ref=f30e83]: 특히 소득 기준이 충족된다면 1인 가구 기준 한 달 월세의 일부를 아낄 수 있는 금액이므로, 이사를 계획 중인 직장인이라면 반드시 체크해야 합니다.
