name: Auto-writer Content Generation

on:
  schedule:
    # 09:00 UTC = 18:00 KST (매일)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit/push)'
        required: false
        default: 'false'
        type: boolean

# 한 번에 하나만 실행 (동시 중복 방지)
concurrency:
  group: auto-writer
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/auto-writer/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/auto-writer/requirements.txt

      - name: Configure git
        run: |
          git config user.name "auto-writer[bot]"
          git config user.email "auto-writer[bot]@users.noreply.github.com"

      - name: Generate content
        run: python3 scripts/auto-writer/ci_generate.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          # LLM APIs
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_TOKEN: ${{ secrets.DEEPSEEK_API_TOKEN }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Data APIs
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # R2 thumbnail upload
          R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.CF_R2_PUBLIC_URL }}
          # Telegram alerts
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Pipeline config
          DAILY_QUOTA: '5'
          ALLOW_PAID: 'false'
          # CI mode: no local build/deploy
          CI: 'true'
