        - heading "자주 묻는 질문 (Q&A)" [level=2] [ref=f114e175]
        - paragraph [ref=f114e176]:
          - strong [ref=f114e177]: Q1. 직장 다니면서 서류 준비와 신청이 직접 가능한가요?
          - text: A1. 네, 가능합니다. 신청일 현재 의왕시에 주민등록이 되어 있다면 정부24를 통해 온라인으로 신청하거나 의왕시청에 직접 방문하여 신청할 수 있습니다. 필요한 서류는 대부분 온라인 발급이 가능하여 미리 준비하면 시간을 단축할 수 있습니다.
        - paragraph [ref=f114e178]:
          - strong [ref=f114e179]: Q2. 이미 대출을 받은 상태에서도 신청할 수 있나요?
          - text: A2. 네, 기존에 이미 금융기관에서 받은 전세자금 대출에 대해서도 지원 요건을 충족한다면 이자를 지원받는 방식입니다. 다만, 대출 상품 자체가 본 사업의 목적에 부합하는 상품이어야 하므로 대출 실행 은행에 지원 대상 상품인지 먼저 확인해야 합니다.
        - insertion [ref=f114e181]
        - paragraph [ref=f114e183]:
          - strong [ref=f114e184]: Q3. 자녀가 생기면 혜택이 더 늘어나나요?
          - text: A3. 본 사업은 혼인 기간과 소득 기준을 기본으로 하며, 자녀 유무에 따라 우선순위가 배정되거나 가점이 부여될 수 있습니다. 정확한 가점은 해당 연도 공고문의 ‘대상자 선정 기준’ 항목을 확인하는 것이 가장 정확합니다.
        - paragraph [ref=f114e185]:
          - strong [ref=f114e186]: Q4. 다른 지역으로 이사를 가게 되면 어떻게 되나요?
          - text: A4. 본 사업은 의왕시 거주자를 대상으로 하므로, 지원을 받는 중에 타 시·군으로 주소를 옮기게 되면 자격이 상실됩니다. 이 경우 해당 이자 지원은 중단된다는 점을 유의해야 합니다.
        - blockquote [ref=f114e187]:
          - paragraph [ref=f114e188]:
            - strong [ref=f114e189]: 신혼부부 또래는 어떤 지원을 받고 있을까?
