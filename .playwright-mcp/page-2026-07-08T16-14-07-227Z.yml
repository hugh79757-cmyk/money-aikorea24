        - heading "소득 및 상황별 선택 가이드" [level=2] [ref=f30e125]
        - paragraph [ref=f30e126]: 본인의 상황에 따라 지원 가능 여부가 달라지니 아래 확인해 보세요.
        - list [ref=f30e127]:
          - listitem [ref=f30e128]:
            - strong [ref=f30e129]: 연 소득 3,300만 원 이하 1인 가구 청년
            - text: → 우선 신청 대상. 중위소득 150% 이내에 안정적으로 들어오므로 40만 원 전액 수령 가능성이 매우 높습니다.
          - listitem [ref=f30e130]:
            - strong [ref=f30e131]: 보증금은 높지만 월세가 낮은 경우
            - text: → 2번 조건(보증금 환산) 확인 필요. 보증금이 높더라도 월세와 합산하여 61만 원 이하라면 혜택을 받을 수 있습니다.
          - listitem [ref=f30e132]:
            - strong [ref=f30e133]: 이미 주택을 소유한 경우
            - text: → 지원 대상에서 제외. 본 사업은 무주택 청년만을 대상으로 하므로 본인 명의 집이 있는지 확인해야 합니다.
        - blockquote [ref=f30e134]:
          - paragraph [ref=f30e135]:
            - strong [ref=f30e136]: 나와 같은 조건의 사람들은 어떻게 살고 있을까?
            - text: 나이·성별·지역만 입력하면 또래 소득·주거·직업 통계를 확인할 수 있습니다.
          - paragraph [ref=f30e137]:
            - link "내 페르소나 통계 보기 →" [ref=f30e138] [cursor=pointer]:
              - /url: /my-persona?src=inline-stats-loan-youth
        - heading "주의사항 및 리스크" [level=2] [ref=f30e139]
        - list [ref=f30e140]:
          - listitem [ref=f30e141]:
            - strong [ref=f30e142]: 증빙 서류 미비 시 지급 불가
            - text: ": 이사 비용 영수증이나 중개수수료 영수증이 없으면 지원이 불가능합니다. 이사 당일 반드시 카드 전제 영수증을 챙겨두세요."
          - listitem [ref=f30e143]:
            - strong [ref=f30e144]: 중복 지원 불가
            - text: ": 타 지자체에서 유사한 이사 지원금을 받았다면 중복 혜택을 받을 수 없습니다."
          - listitem [ref=f30e145]:
            - strong [ref=f30e146]: ⚠️ 예산 소진 시 조기 종료
            - text: ": 사업 예산에 따라 조기에 마감될 수 있으므로 이사 후 즉시 신청하는 것이 가장 안전합니다."
        - heading "자주 묻는 질문 (Q&A)" [level=2] [ref=f30e147]
        - paragraph [ref=f30e148]:
          - strong [ref=f30e149]: Q1. 직장 다니면서 서류 준비하면 바로 신청 가능한가요?
          - text: A1. 네, 가능합니다. 다만 신청 시점에 의왕시로 전입신고가 완료되어 있어야 하며, 세대주여야 합니다. 서류는 미리 준비하여 관할 행정복지센터를 방문하거나 온라인을 통해 편리하게 신청하실 수 있습니다.
        - paragraph [ref=f30e150]:
          - strong [ref=f30e151]: Q2. 이사 비용 영수증은 어떤 것들이 인정되나요?
          - text: A2. 이사업체에서 발행받은 카드 영수증이나 현금영수증이 인정됩니다. 개인 간 계좌이체 내역만으로는 증빙이 어려울 수 있으니 반드시 업체 사업자 명의로 된 정식 증빙 서류를 발급받으시기 바랍니다.
        - paragraph [ref=f30e152]:
          - strong [ref=f30e153]: Q3. 이사한 지 몇 달 지났는데 신청할 수 있나요?
          - text: "A3. 보통 전입신고 후 일정 기간(예: 6개월 이내) 내에 신청해야 하는 조건이 붙습니다. 정확한 기한은 연도별에 따라 다를 수 있으므로 이사 직후 의왕시청 기업일자리과에 확인하시는 것이 좋습니다."
        - paragraph [ref=f30e154]:
          - strong [ref=f30e155]: Q4. 월세도 지원 대상에 포함되나요?
          - text: A4. 아니요, 이 사업은 ‘이사 비용’과 ‘중개수수료’를 지원하는 사업입니다. 매달 내는 월세 자체를 지원하는 방식은 아니니 이사 시점에 발생한 비용 위주로 확인해 주세요.
